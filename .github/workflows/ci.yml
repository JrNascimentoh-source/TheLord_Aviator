name: Validate TheLord_Aviator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run core tests
        run: node core.test.js
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check timing.js
          node --check timing-core.js
          node --check probability-core.js
          node --check Coletor-Universal-v2.1.js
          node --check coletor.user.js
          node --check coletor-aviator2.user.js
